# Builds the macOS DMG and the Ubuntu .debs of both apps (Messenger for
# Escargot, Messenger for Matrix) on every push; a v* tag also publishes them
# as a GitHub release. No Microsoft assets are involved: users import those
# from their own installer after installing.
#
# Optional macOS signing/notarization secrets (unsigned, ad-hoc builds without):
#   MACOS_CERTIFICATE           base64 of the Developer ID Application .p12
#   MACOS_CERTIFICATE_PASSWORD  its password
#   MACOS_SIGN_IDENTITY         e.g. "Developer ID Application: Name (TEAMID)"
#   NOTARY_KEY                  base64 of the App Store Connect API key (.p8)
#   NOTARY_KEY_ID, NOTARY_ISSUER
name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths-ignore: ["site/**", ".github/workflows/pages.yml"]
  pull_request:
    paths-ignore: ["site/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read

env:
  SWIFT_VERSION: "6.4.1"

jobs:
  macos:
    name: macOS DMG
    # Xcode 27: earlier linkers (16.4, 26.3) assert on matrix-rust-sdk's
    # prebuilt objects when linking Messenger for Matrix. The universal build
    # doesn't care which Mac it runs on.
    runs-on: xcode-27
    env:
      MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
      NOTARY_KEY_B64: ${{ secrets.NOTARY_KEY }}
    steps:
      - uses: actions/checkout@v4
      - name: Version
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then v="${GITHUB_REF_NAME#v}"; else v="0.0.0~git$(git rev-parse --short HEAD)"; fi
          echo "VERSION=$v" >> "$GITHUB_ENV"
          echo "BUILD_NUMBER=$GITHUB_RUN_NUMBER" >> "$GITHUB_ENV"
          swift --version
          xcodebuild -version
      - name: Test
        working-directory: Messenger
        run: swift test
      - name: Import signing certificate
        if: env.MACOS_CERTIFICATE != ''
        env:
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
        run: |
          kc="$RUNNER_TEMP/signing.keychain-db"
          kc_pw="$(openssl rand -hex 16)"
          echo "$MACOS_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$kc_pw" "$kc"
          security set-keychain-settings -lut 21600 "$kc"
          security unlock-keychain -p "$kc_pw" "$kc"
          security import "$RUNNER_TEMP/cert.p12" -P "$MACOS_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$kc"
          security set-key-partition-list -S apple-tool:,apple: -k "$kc_pw" "$kc" >/dev/null
          security list-keychains -d user -s "$kc" $(security list-keychains -d user | tr -d '"')
          echo "SIGN_IDENTITY=$MACOS_SIGN_IDENTITY" >> "$GITHUB_ENV"
      - name: Notarization key
        if: env.NOTARY_KEY_B64 != ''
        env:
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER: ${{ secrets.NOTARY_ISSUER }}
        run: |
          echo "$NOTARY_KEY_B64" | base64 --decode > "$RUNNER_TEMP/notary.p8"
          echo "NOTARY_KEY=$RUNNER_TEMP/notary.p8" >> "$GITHUB_ENV"
          echo "NOTARY_KEY_ID=$NOTARY_KEY_ID" >> "$GITHUB_ENV"
          echo "NOTARY_ISSUER=$NOTARY_ISSUER" >> "$GITHUB_ENV"
      - name: Build DMG (universal)
        run: ARCHS="arm64 x86_64" Messenger/scripts/package-dmg.sh
      - name: Build Messenger for Matrix DMG (universal)
        run: VARIANT=matrix ARCHS="arm64 x86_64" Messenger/scripts/package-dmg.sh
      - uses: actions/upload-artifact@v4
        with:
          name: macos-dmg
          path: Messenger/build/*.dmg
          if-no-files-found: error

  ubuntu:
    name: Ubuntu ${{ matrix.ubuntu }} .deb (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        # One package per release: sonames (libxml2) differ between them.
        include:
          - { ubuntu: "24.04", arch: amd64, runner: ubuntu-24.04 }
          - { ubuntu: "24.04", arch: arm64, runner: ubuntu-24.04-arm }
          - { ubuntu: "26.04", arch: amd64, runner: ubuntu-24.04, container: "ubuntu:26.04" }
          - { ubuntu: "26.04", arch: arm64, runner: ubuntu-24.04-arm, container: "ubuntu:26.04" }
    runs-on: ${{ matrix.runner }}
    container: ${{ matrix.container }}
    defaults:
      run:
        shell: bash  # containers default to sh; swiftly's env.sh needs bash
    env:
      DEBIAN_FRONTEND: noninteractive
    steps:
      - name: Install build dependencies
        run: |
          SUDO=""; [ "$(id -u)" = 0 ] || SUDO=sudo
          # The package servers fail now and then, or the runner's resolver
          # can't find them (one of their name servers down did that): a few
          # tries, from the second on with a public resolver.
          for attempt in 1 2 3 4 5; do
            [ "$attempt" = 1 ] || echo "nameserver 8.8.8.8" | $SUDO tee /etc/resolv.conf >/dev/null
            timeout 120 $SUDO apt-get update && \
              $SUDO apt-get install -y --no-install-recommends libgtk-4-dev dpkg-dev binutils g++ git cmake \
                curl ca-certificates gnupg2 unzip tzdata pkg-config libcurl4-openssl-dev libxml2-dev \
                libsqlite3-dev libncurses-dev libedit-dev zlib1g-dev && break
            [ "$attempt" != 5 ] || exit 1
            sleep 20
          done
      - uses: actions/checkout@v4
      # matrix-rust-sdk for Messenger for Matrix (end-to-end encryption): about
      # 15 minutes, so kept between runs until build-matrix-sdk.sh changes.
      - uses: actions/cache/restore@v4
        id: matrix-sdk
        with:
          path: Messenger/Vendor/MatrixSDK
          key: matrix-sdk-ubuntu${{ matrix.ubuntu }}-${{ matrix.arch }}-${{ hashFiles('linux/scripts/build-matrix-sdk.sh') }}
      - name: Build matrix-rust-sdk
        if: steps.matrix-sdk.outputs.cache-hit != 'true'
        run: |
          command -v cargo >/dev/null || [ -f "$HOME/.cargo/env" ] || curl -fsSL https://sh.rustup.rs | sh -s -- -y --profile minimal
          [ -f "$HOME/.cargo/env" ] && . "$HOME/.cargo/env"
          rustup update stable && rustup default stable
          linux/scripts/build-matrix-sdk.sh
      - uses: actions/cache/save@v4
        if: steps.matrix-sdk.outputs.cache-hit != 'true'
        with:
          path: Messenger/Vendor/MatrixSDK
          key: ${{ steps.matrix-sdk.outputs.cache-primary-key }}
      - name: Install Swift ${{ env.SWIFT_VERSION }}
        run: |
          # In containers $HOME isn't the account's home, which swiftly would use.
          export SWIFTLY_HOME_DIR="$HOME/.local/share/swiftly" SWIFTLY_BIN_DIR="$HOME/.local/share/swiftly/bin"
          curl -fsSL -O "https://download.swift.org/swiftly/linux/swiftly-$(uname -m).tar.gz"
          tar zxf "swiftly-$(uname -m).tar.gz"
          ./swiftly init --quiet-shell-followup --assume-yes --skip-install
          . "$HOME/.local/share/swiftly/env.sh"
          # swiftly lists the system packages this toolchain still needs (they differ
          # per release) in a script instead of failing; run it.
          swiftly install --use --assume-yes --post-install-file "$RUNNER_TEMP/swift-deps.sh" "$SWIFT_VERSION"
          if [ -s "$RUNNER_TEMP/swift-deps.sh" ]; then
            SUDO=""; [ "$(id -u)" = 0 ] || SUDO=sudo
            $SUDO bash "$RUNNER_TEMP/swift-deps.sh"
          fi
          swift --version
      - name: Version
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then v="${GITHUB_REF_NAME#v}"; else v="0.0.0~git$(echo "$GITHUB_SHA" | cut -c1-7)"; fi
          echo "VERSION=$v" >> "$GITHUB_ENV"
      - name: Test
        working-directory: Messenger
        run: |
          . "$HOME/.local/share/swiftly/env.sh"
          swift test
      # Both Matrix clients against the dev Synapse (Docker: on the runner
      # itself only): the one on matrix-rust-sdk, then the plain one that a
      # build without the SDK falls back to, with its unit tests.
      - name: Matrix end-to-end tests
        if: matrix.ubuntu == '24.04' && matrix.arch == 'amd64'
        run: |
          . "$HOME/.local/share/swiftly/env.sh"
          docker compose -f devserver/matrix/docker-compose.yml up -d
          for i in $(seq 1 90); do
            curl -fsS -X POST -d '{"type":"m.login.password","identifier":{"type":"m.id.user","user":"carol"},"password":"123456"}' \
              http://127.0.0.1:8008/_matrix/client/v3/login >/dev/null 2>&1 && break
            sleep 2
          done
          cd Messenger
          accounts="@alice:localhost @bob:localhost 123456 @carol:localhost"
          swift build --product msnctl
          .build/debug/msnctl --matrix http://127.0.0.1:8008 e2e $accounts
          export MESSENGER_PLAIN_MATRIX=1
          swift test --scratch-path .build-plain --filter MatrixKitTests
          swift build --scratch-path .build-plain --product msnctl
          .build-plain/debug/msnctl --matrix http://127.0.0.1:8008 e2e $accounts
          docker compose -f ../devserver/matrix/docker-compose.yml down
      - name: Build .debs
        run: |
          . "$HOME/.local/share/swiftly/env.sh"
          linux/scripts/package-deb.sh
          [ -f "$HOME/.cargo/env" ] && . "$HOME/.cargo/env"
          VARIANT=matrix linux/scripts/package-deb.sh
      - name: Install check
        run: |
          SUDO=""; [ "$(id -u)" = 0 ] || SUDO=sudo
          # As above: with a public resolver if the runner's can't find the package servers.
          timeout 300 $SUDO apt-get install -y ./build/*.deb || {
            echo "nameserver 8.8.8.8" | $SUDO tee /etc/resolv.conf >/dev/null
            $SUDO apt-get install -y ./build/*.deb
          }
          for app in wlm-messenger wlm-messenger-matrix; do
            ! ldd "/usr/bin/$app" | grep "not found"
            dpkg -L "$app"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: ubuntu-${{ matrix.ubuntu }}-deb-${{ matrix.arch }}
          path: build/*.deb
          if-no-files-found: error

  release:
    name: GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [macos, ubuntu]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes
