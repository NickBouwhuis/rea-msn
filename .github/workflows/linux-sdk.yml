# Temporary, while Messenger for Matrix's encrypting client is brought to Linux:
# builds matrix-rust-sdk there, then msnctl on it, and runs the Matrix
# end-to-end test against the dev Synapse.
name: Linux Matrix SDK

on:
  push:
    branches: [linux-matrix-sdk]

permissions:
  contents: read

env:
  SWIFT_VERSION: "6.4.1"

jobs:
  e2e:
    name: msnctl e2e with matrix-rust-sdk on Ubuntu 24.04
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends g++ cmake pkg-config libcurl4-openssl-dev libxml2-dev \
            libsqlite3-dev libncurses-dev libedit-dev zlib1g-dev
      - uses: actions/cache/restore@v4
        id: sdk
        with:
          path: Messenger/Vendor/MatrixSDK
          key: matrix-sdk-ubuntu24.04-${{ runner.arch }}-${{ hashFiles('linux/scripts/build-matrix-sdk.sh') }}
      - name: Build matrix-rust-sdk
        if: steps.sdk.outputs.cache-hit != 'true'
        run: |
          rustup update stable && rustup default stable
          linux/scripts/build-matrix-sdk.sh
      - uses: actions/cache/save@v4
        if: steps.sdk.outputs.cache-hit != 'true'
        with:
          path: Messenger/Vendor/MatrixSDK
          key: ${{ steps.sdk.outputs.cache-primary-key }}
      - name: Install Swift ${{ env.SWIFT_VERSION }}
        run: |
          export SWIFTLY_HOME_DIR="$HOME/.local/share/swiftly" SWIFTLY_BIN_DIR="$HOME/.local/share/swiftly/bin"
          curl -fsSL -O "https://download.swift.org/swiftly/linux/swiftly-$(uname -m).tar.gz"
          tar zxf "swiftly-$(uname -m).tar.gz"
          ./swiftly init --quiet-shell-followup --assume-yes --skip-install
          . "$SWIFTLY_HOME_DIR/env.sh"
          swiftly install --use --assume-yes --post-install-file "$RUNNER_TEMP/swift-deps.sh" "$SWIFT_VERSION"
          if [ -s "$RUNNER_TEMP/swift-deps.sh" ]; then sudo bash "$RUNNER_TEMP/swift-deps.sh"; fi
          swift --version
      - name: Build msnctl
        working-directory: Messenger
        run: |
          . "$HOME/.local/share/swiftly/env.sh"
          swift build --product msnctl
      - name: Start Synapse
        run: |
          docker compose -f devserver/matrix/docker-compose.yml up -d
          for i in $(seq 1 90); do
            curl -fsS -X POST -d '{"type":"m.login.password","identifier":{"type":"m.id.user","user":"carol"},"password":"123456"}' \
              http://127.0.0.1:8008/_matrix/client/v3/login >/dev/null 2>&1 && exit 0
            sleep 2
          done
          exit 1
      - name: End-to-end test
        working-directory: Messenger
        run: .build/debug/msnctl --matrix http://127.0.0.1:8008 e2e @alice:localhost @bob:localhost 123456 @carol:localhost
